<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файний Господар - Магазин інструментів</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #1a1a1a;
            color: #fff;
        }

        /* НАВІГАЦІЙНЕ МЕНЮ */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(20,20,20,0.97);
            border-bottom: 2px solid #ff8c00;
            z-index: 9000;
            padding: 0 20px;
        }
        .nav-inner {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 55px;
        }
        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            color: #ff8c00;
            font-size: 1.3em;
            letter-spacing: 2px;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 5px;
            list-style: none;
        }
        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 6px 10px;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .nav-links a:hover {
            color: #ff8c00;
            background: rgba(255,140,0,0.1);
        }
        .nav-burger {
            display: none;
            cursor: pointer;
            font-size: 1.5em;
            color: #ff8c00;
        }
        .nav-mobile {
            display: none;
            flex-direction: column;
            background: rgba(20,20,20,0.98);
            padding: 10px 20px 15px;
            border-top: 1px solid #333;
        }
        .nav-mobile a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            padding: 10px 0;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-mobile a:hover { color: #ff8c00; }
        .nav-mobile.open { display: flex; }

        header {
            position: relative;
            padding: 60px 20px;
            text-align: center;
            overflow: hidden;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 55px;
        }
        .header-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.3);
            transform: scale(1.1);
            z-index: 0;
        }
        .header-content { position: relative; z-index: 1; }
        .header-logo {
            height: 160px;
            display: block;
            margin: 0 auto 20px;
            filter: drop-shadow(0 0 20px rgba(255,140,0,0.8));
        }
        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 6em;
            color: #fff;
            letter-spacing: 8px;
            line-height: 1;
            text-shadow: 3px 3px 20px rgba(0,0,0,0.8);
        }
        header h1 span { color: #ff8c00; }
        .subtitle {
            margin: 8px 0 0;
            color: #ddd;
            font-size: 1em;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .service-badge {
            display: inline-block;
            background: #ff8c00;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 1.1em;
            padding: 8px 25px;
            border-radius: 20px;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header-cta {
            display: inline-block;
            margin-top: 20px;
            background: transparent;
            color: #ff8c00;
            border: 2px solid #ff8c00;
            padding: 12px 35px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1em;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .header-cta:hover {
            background: #ff8c00;
            color: #1a1a1a;
        }
        .container {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            text-align: center;
            color: #ff8c00;
            font-size: 2em;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }
        .card {
            position: relative;
            border-radius: 10px;
            padding: 20px 15px;
            flex: 1;
            min-width: 200px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        .card-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(3px) brightness(0.35);
            transform: scale(1.05);
            z-index: 0;
        }
        .card-content { position: relative; z-index: 1; width: 100%; }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255,140,0,0.4);
        }
        .card h3 {
            font-family: 'Bebas Neue', sans-serif;
            color: #ff8c00;
            margin-bottom: 8px;
            font-size: 1.2em;
            letter-spacing: 1px;
            line-height: 1.3;
            text-align: center;
        }
        .card p { color: #ddd; font-size: 0.85em; line-height: 1.5; }
        .card-list {
            display: none;
            margin-top: 15px;
            text-align: left;
            width: 100%;
            border-top: 1px solid #ff8c00;
            padding-top: 12px;
        }
        .card-list.open { display: block; }
        .card-list ul { list-style: none; padding: 0; }
        .card-list ul li {
            padding: 6px 0;
            color: #fff;
            font-size: 0.9em;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-list ul li:last-child { border-bottom: none; }
        .card-list ul li span { color: #ff8c00; font-size: 1.1em; }
        .card-toggle {
            display: inline-block;
            margin-top: 10px;
            color: #ff8c00;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 50px;
        }
        .tool-card {
            background: #2d2d2d;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
            transition: transform 0.2s;
        }
        .tool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255,140,0,0.2);
        }
        .tool-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .tool-card p {
            padding: 10px;
            text-align: center;
            color: #ff8c00;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1em;
            letter-spacing: 1px;
        }
        .repair-block {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #2d1a00, #1a1100);
            border: 2px solid #ff8c00;
            border-radius: 12px;
            padding: 40px 30px;
            margin-bottom: 50px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255,140,0,0.2);
        }
        .repair-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('foto17.png');
            background-size: cover;
            background-position: center;
            filter: blur(4px) brightness(0.2);
            transform: scale(1.05);
            z-index: 0;
        }
        .repair-content { position: relative; z-index: 1; }
        .repair-content .repair-icon {
            font-size: 4em;
            display: block;
            margin-bottom: 15px;
        }
        .repair-content h2 {
            font-family: 'Bebas Neue', sans-serif;
            color: #ff8c00;
            font-size: 2.5em;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-align: center;
        }
        .repair-content p {
            color: #fff;
            line-height: 1.8;
            font-size: 1.1em;
            max-width: 700px;
            margin: 0 auto;
        }
        .brands-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 50px;
        }
        .brand-item {
            padding: 10px 22px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.95em;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .brand-item:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .brand-yato     { background: #cc0000; color: #fff; border: 2px solid #ff0000; }
        .brand-vitals   { background: #003399; color: #fff; border: 2px solid #0044cc; }
        .brand-forte    { background: #1a6600; color: #fff; border: 2px solid #228800; }
        .brand-sturmax  { background: #ff6600; color: #fff; border: 2px solid #ff8c00; }
        .brand-tekhman  { background: #cc5500; color: #fff; border: 2px solid #ff6600; }
        .brand-zenit    { background: #003399; color: #ff8c00; border: 2px solid #ff8c00; }
        .brand-grunhelm { background: #1a6600; color: #fff; border: 2px solid #33aa00; }
        .brand-gartner  { background: #006633; color: #fff; border: 2px solid #009944; }
        .brand-werk     { background: #cc0000; color: #fff; border: 2px solid #ee0000; }
        .brand-haisser  { background: #003399; color: #ffcc00; border: 2px solid #ffcc00; }
        .brand-oleomac  { background: #ff6600; color: #fff; border: 2px solid #ff8c00; }
        .photos-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }
        .photos-grid img {
            flex: 1;
            min-width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #444;
            transition: transform 0.2s;
        }
        .photos-grid img:hover {
            transform: scale(1.02);
            border-color: #ff8c00;
        }
        .hot-block {
            background: linear-gradient(135deg, #2d1a00, #1a1a1a);
            border: 2px solid #ff8c00;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 50px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255,140,0,0.2);
        }
        .hot-block h2 {
            font-family: 'Bebas Neue', sans-serif;
            color: #ff8c00;
            font-size: 2.5em;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .hot-block p { color: #ccc; margin-bottom: 20px; font-size: 0.95em; }
        .posters-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 25px 0;
        }
        .poster-item {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ff8c00;
            box-shadow: 0 0 20px rgba(255,140,0,0.3);
            transition: transform 0.2s;
        }
        .poster-item:hover { transform: scale(1.02); }
        .poster-item img {
            width: 100%;
            display: block;
            cursor: pointer;
        }
        .social-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn-tiktok {
            background: #000; color: #fff;
            border: 2px solid #ff0050;
            padding: 14px 30px; border-radius: 25px;
            text-decoration: none; font-weight: 700;
            font-size: 1em; transition: all 0.2s;
        }
        .btn-tiktok:hover { background: #ff0050; }
        .btn-facebook {
            background: #1877f2; color: #fff;
            border: 2px solid #1877f2;
            padding: 14px 30px; border-radius: 25px;
            text-decoration: none; font-weight: 700;
            font-size: 1em; transition: all 0.2s;
        }
        .btn-facebook:hover { background: #0d5ab8; }
        .contacts {
            background: #2d2d2d;
            border: 1px solid #444;
            border-left: 4px solid #ff8c00;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .contacts h2 {
            font-family: 'Bebas Neue', sans-serif;
            color: #ff8c00;
            margin-bottom: 20px;
            font-size: 2em;
            letter-spacing: 2px;
        }
        .contacts p { font-size: 1.1em; color: #ddd; margin: 12px 0; }
        .contacts a { color: #ff8c00; text-decoration: none; font-weight: bold; }
        .btn-wrap { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .btn-call {
            background: #ff8c00; color: #1a1a1a;
            padding: 14px 30px; border-radius: 25px;
            text-decoration: none; font-weight: 700;
            font-size: 1em; transition: background 0.2s;
        }
        .btn-call:hover { background: #ffa500; }
        .btn-viber {
            background: #7360f2; color: white;
            padding: 14px 30px; border-radius: 25px;
            text-decoration: none; font-weight: 700;
            font-size: 1em; transition: background 0.2s;
        }
        .btn-viber:hover { background: #5a4bd1; }
        .btn-whatsapp {
            background: #25d366; color: white;
            padding: 14px 30px; border-radius: 25px;
            text-decoration: none; font-weight: 700;
            font-size: 1em; transition: background 0.2s;
        }
        .btn-whatsapp:hover { background: #1da851; }
        .address-block {
            background: #2d2d2d;
            border: 1px solid #444;
            border-left: 4px solid #ff8c00;
            border-radius: 8px;
            padding: 25px 30px;
            margin-bottom: 30px;
        }
        .address-block h3 {
            font-family: 'Bebas Neue', sans-serif;
            color: #ff8c00;
            font-size: 1.5em;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .address-block p { color: #ddd; font-size: 1.05em; margin: 5px 0; }
        .address-block .territory {
            color: #aaa;
            font-size: 0.9em;
            margin-top: 8px;
            font-style: italic;
        }
        .map-container {
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ff8c00;
            margin-bottom: 50px;
        }
        footer {
            background: #111;
            border-top: 3px solid #ff8c00;
            color: #888;
            text-align: center;
